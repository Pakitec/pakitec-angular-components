<div class="paki-filter-chips" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="paki-filter-chips__chip"
      [class.paki-filter-chips__chip--selected]="isSelected(option.value)"
      [attr.aria-pressed]="isSelected(option.value)"
      (click)="toggle(option.value)"
    >
      <span>{{ option.label }}</span>
      @if (option.count !== undefined) {
        <span class="paki-filter-chips__count">{{ option.count }}</span>
      }
    </button>
  }
</div>
