<label>
  <span>{{ label() }}</span>
  <div class="paki-select__control" #control>
    <input
      type="text"
      role="combobox"
      [value]="displayText()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [attr.aria-expanded]="open()"
      aria-haspopup="listbox"
      aria-autocomplete="list"
      autocomplete="off"
      spellcheck="false"
      [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? 'paki-option-' + activeIndex() : null"
      (input)="onInput($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur()"
      (keydown)="onKeydown($event)"
    />
    <button
      type="button"
      class="paki-select__toggle"
      [class.open]="open()"
      [disabled]="disabled()"
      [attr.aria-label]="open() ? 'Fechar opções' : 'Abrir opções'"
      (mousedown)="$event.preventDefault(); toggle()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    @if (open()) {
      <ul
        #panel
        class="paki-select__dropdown"
        role="listbox"
        [class.up]="panelPos().up"
        [style.top.px]="panelPos().top"
        [style.left.px]="panelPos().left"
        [style.width.px]="panelPos().width"
        [style.max-height.px]="panelPos().maxHeight"
        [style.visibility]="panelPos().ready ? null : 'hidden'"
        (mousedown)="$event.preventDefault()"
        (scroll)="onScroll($event)"
      >
        @if (searching()) {
          <li class="paki-select__feedback" role="status">Carregando...</li>
        }
        @for (option of displayOptions(); track option.value; let i = $index) {
          <li
            [id]="'paki-option-' + i"
            role="option"
            [attr.aria-selected]="value() === option.value"
            [class.active]="activeIndex() === i"
            [class.selected]="value() === option.value"
            (mousedown)="$event.preventDefault(); select(option)"
          >@for (part of highlight(option.label); track $index) {@if (part.match) {<mark>{{ part.text }}</mark>} @else {{{ part.text }}}}</li>
        }
        @if (showNoResults()) {
          <li class="paki-select__feedback" role="status">{{ noResultsMessage() }}</li>
        }
      </ul>
    }
  </div>
</label>
