<div
  class="paki-toast-stack"
  [class]="positionClass()"
  aria-live="polite"
  aria-atomic="false"
>
  @for (toast of service.toasts(); track toast.id) {
    <paki-toast
      [data]="toast"
      [class.leaving]="toast.leaving"
      (closed)="close(toast.id)"
      (mouseenter)="onMouseEnter(toast.id)"
      (mouseleave)="onMouseLeave(toast.id)"
      (focusin)="onFocusIn(toast.id)"
      (focusout)="onFocusOut(toast.id, $event)"
    />
  }
</div>
